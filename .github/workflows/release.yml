name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - name: Check web UI
        run: cd web && bun install --frozen-lockfile && bun run check
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build every platform
        run: VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }} scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lowlex
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  # Runs each released binary on its own system.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64, bin: lowlex }
          - { os: macos-14, target: darwin-arm64, bin: lowlex }
          - { os: macos-15-intel, target: darwin-amd64, bin: lowlex }
          - { os: windows-latest, target: windows-amd64, bin: lowlex.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lowlex
          path: dist
      - name: Extract
        run: |
          cd dist
          f=$(ls lowlex-*-${{ matrix.target }}.* | head -1)
          case "$f" in *.zip) unzip -q "$f" ;; *) tar -xzf "$f" ;; esac
      - name: Smoke test
        run: scripts/smoke.sh "$(ls -d dist/lowlex-*-${{ matrix.target }}/)${{ matrix.bin }}"

  image:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/lowbloat/lowlex:${{ github.ref_name }}
            ghcr.io/lowbloat/lowlex:latest
